services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pelican
      POSTGRES_PASSWORD: pelican
      POSTGRES_DB: pelican
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelican -d pelican"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://pelican:pelican@db:5432/pelican
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
