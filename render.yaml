services:
  - type: web
    name: pelican-pricing
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pelican-pricing-db
          property: connectionString
      - key: PORT
        value: "8000"

databases:
  - name: pelican-pricing-db
    plan: basic-256mb
    region: oregon
    databaseName: pelican
    user: pelican
